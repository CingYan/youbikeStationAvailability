<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=2point0.html">
  <title>YouBike 2.0 工作區域已整合</title>
  <script>
    // 這頁只閃一下就轉走，但轉場閃白底一樣刺眼，所以沿用主頁存下來的佈景設定
    (function () {
      var mode = 'auto';
      try { mode = localStorage.getItem('yb-theme') || 'auto'; } catch (e) {}
      var dark = mode === 'dark' ||
        (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <style>
    :root { color-scheme: light; --bg: #f0f2f5; --fg: #333; --link: #2E7D32; }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #12141a; --fg: #e3e6ea; --link: #7fd995; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    a { color: var(--link); }
  </style>
  <script>
    window.location.replace('2point0.html')
  </script>
</head>
<body>
  <main>
    <p>2.0 工作區域已整合到主頁。</p>
    <p><a href="2point0.html">前往 YouBike 2.0</a></p>
  </main>
</body>
</html>
